<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Same font as polybar everywhere "monospace" is asked for:
     terminals (alacritty), dunst, rofi, GTK monospace. Nerd Font symbols
     come next so icons in prompts and TUIs render. -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Monaspace Xenon Slashed</family>
      <family>Symbols Nerd Font Mono</family>
    </prefer>
  </alias>
</fontconfig>
