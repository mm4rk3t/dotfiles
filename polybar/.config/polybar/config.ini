[global/wm]
include-file = ~/.cache/wallust/polybar.ini

[mono]
bg = #000000
fg = ${colors.foreground}
bg-active = #333333

[bar/my_bar]
monitor = ${env:MONITOR:}
width = 100%:-30
height = 20pt
radius = 0

dpi = 96

background = ${mono.bg}
foreground = ${mono.fg}

line-size = 2pt

border-size = 2pt
border-color = ${colors.secondary}

padding-left = 0
padding-right = 1

module-margin = 1

separator =  
separator-foreground = ${mono.fg}

font-0 = Monaspace Xenon Slashed:size=10;2
font-1 = Symbols Nerd Font:size=11;3

modules-left = xworkspaces xwindow
modules-center = nowplaying
modules-right = traytoggle systray statstoggle cpu memory temperature dnd wlan eth pulseaudio backlight battery time date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
wm-restack = i3

override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
; Same bar for non-primary monitors, without the tray (only one tray can exist)
offset-x = 15
offset-y = 15


[bar/my_bar_secondary]
inherit = bar/my_bar
modules-left = xworkspaces xwindow
modules-right = wlan eth pulseaudio backlight battery time date

[module/systray]
type = internal/tray
hidden = true

; format-margin = 8pt
tray-spacing = 12pt
tray-size = 12pt

; Windows-style tray: click the arrow to show/hide tray icons
[module/traytoggle]
type = custom/ipc
hook-0 = echo "󰅁"
hook-1 = echo "󰅂"
initial = 1
click-left = polybar-msg -p %pid% action systray module_toggle && polybar-msg -p %pid% action traytoggle next

[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
; Default: 100
full-at = 99

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 15

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
;
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
;
; Disable polling by setting the interval to 0.
;
; Default: 5
poll-interval = 5

; see "man date" for details on how to format the time string
; NOTE: if you want to use syntax tags here you need to use %%{...}
; Default: %H:%M:%S
time-format = %H:%M

; Available tags:
;   <label-charging> (default)
;   <bar-capacity>
;   <ramp-capacity>
;   <animation-charging>
format-charging = <animation-charging> <label-charging>

; Available tags:
;   <label-discharging> (default)
;   <bar-capacity>
;   <ramp-capacity>
;   <animation-discharging>
format-discharging = <ramp-capacity> <label-discharging>

; Available tags:
;   <label-full> (default)
;   <bar-capacity>
;   <ramp-capacity>
format-full = <ramp-capacity> <label-full>

; Format used when battery level drops to low-at
; If not defined, format-discharging is used instead.
; Available tags:
;   <label-low>
;   <animation-low>
;   <bar-capacity>
;   <ramp-capacity>
; New in version 3.6.0
format-low = <animation-low> <label-low>

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current charge rate in watts)
label-charging = %percentage%%

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current discharge rate in watts)
label-discharging = %percentage%%

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
label-full = %percentage%%

; Available tokens:
;   %percentage% (default) - is set to 100 if full-at is reached
;   %percentage_raw%
;   %time%
;   %consumption% (shows current discharge rate in watts)
; New in version 3.6.0
label-low = %percentage%%

; Only applies if <ramp-capacity> is used
ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁽
ramp-capacity-3 = 󰁿
ramp-capacity-4 = 󰁹

; Only applies if <bar-capacity> is used
bar-capacity-width = 10

; Only applies if <animation-charging> is used
animation-charging-0 = 󰂆
animation-charging-1 = 󰂈
animation-charging-2 = 󰂉
animation-charging-3 = 󰂊
animation-charging-4 = 󰂅
; Framerate in milliseconds
animation-charging-framerate = 750

; Only applies if <animation-discharging> is used
animation-discharging-0 = 󰂎
animation-discharging-1 = 󰁻
animation-discharging-2 = 󰁽
animation-discharging-3 = 󰁿
animation-discharging-4 = 󰁹
; Framerate in milliseconds
animation-discharging-framerate = 500

; Only applies if <animation-low> is used
; New in version 3.6.0
animation-low-0 = 󰂃
animation-low-1 =  
animation-low-framerate = 500
label-low-foreground = #ff5555
animation-low-foreground = #ff5555


[module/xworkspaces]
type = internal/xworkspaces
pin-workspaces = true


label-active = %name%
label-active-foreground = ${mono.fg}
label-active-underline = ${colors.secondary}
label-active-padding = 1

label-occupied = %name%
label-occupied-foreground = ${mono.fg}
label-occupied-padding = 1

label-urgent = %name%
label-urgent-foreground = ${mono.fg}
label-urgent-background = #880000
label-urgent-padding = 1

label-empty = 
label-empty-foreground = ${mono.fg}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:100:…%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

label-mounted = %mountpoint% %percentage_used%%
label-mounted-foreground = ${mono.fg}

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${mono.fg}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = 󰖁 muted

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

label-muted-foreground = ${mono.fg}
interval = 5
click-right = pavucontrol &


[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <ramp> <label>
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃞
ramp-2 = 󰃟
ramp-3 = 󰃟
ramp-4 = 󰃠

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${mono.fg}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
hidden = true
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${mono.fg}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
hidden = true
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${mono.fg}
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %ifname% disconnected
label-disconnected-foreground = ${mono.fg}

[module/wlan]
inherit = network-base
interface-type = wireless
label-connected = %{A1:nm-connection-editor &:}%essid%%{A}
label-disconnected = 󰖪
label-connected-foreground = ${mono.fg}
format-connected = <ramp-signal> <label-connected>
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨


[module/eth]
inherit = network-base
interface-type = wired
label-connected = 󰈀
format-disconnected =
label-connected-foreground = ${mono.fg}

[module/date]
type = internal/date
interval = 1

label = %{A1:~/.config/polybar/scripts/calendar.sh:}󰃭 %date%%{A}
label-foreground = ${mono.fg}

date = %Y-%m-%d


[module/powermenu]
type = custom/text
format = 󰐥
format-padding = 1
click-left = ~/.config/polybar/scripts/powermenu.sh &

[module/dnd]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/dnd.sh
initial = 1
click-left = ~/.config/polybar/scripts/dnd.sh toggle
click-right = dunstctl history-pop

[module/nowplaying]
type = custom/script
exec = ~/.config/polybar/scripts/nowplaying.sh
tail = true
click-left = playerctl play-pause
scroll-up = playerctl next
scroll-down = playerctl previous

; 7. hidden system stats, toggled like the tray
[module/statstoggle]
type = custom/ipc
hook-0 = echo "󰊚"
initial = 1
click-left = polybar-msg -p %pid% action cpu module_toggle && polybar-msg -p %pid% action memory module_toggle && polybar-msg -p %pid% action temperature module_toggle

[module/temperature]
type = internal/temperature
hidden = true
interval = 2
zone-type = x86_pkg_temp
warn-temperature = 80
format = <label>
format-warn = <label-warn>
label = TEMP %temperature-c%
label-warn = TEMP %temperature-c%
label-warn-foreground = #ff5555

[module/time]
type = internal/date
interval = 1
time = %H:%M
label = %{A1:~/.config/polybar/scripts/calendar.sh:}󰅐 %time%%{A}
label-foreground = ${mono.fg}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
